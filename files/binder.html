<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1c1c24;font-family:'Inter',sans-serif;color:#fff}

#bar{
  position:fixed;top:0;left:0;right:0;height:50px;z-index:100;
  background:rgba(20,20,30,0.95);border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;gap:12px;padding:0 20px;
  backdrop-filter:blur(12px);
}
.back{font-size:12px;font-weight:600;color:rgba(255,255,255,0.4);text-decoration:none;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);transition:all .15s}
.back:hover{color:#fff;background:rgba(255,255,255,0.08)}
#bname{background:transparent;border:none;font-size:14px;font-weight:600;color:#fff;outline:none;width:160px;border-bottom:1px solid transparent;padding:2px 4px;transition:border-color .15s}
#bname:focus{border-bottom-color:#6366f1}
.sp{flex:1}
.sz{font-size:11px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);transition:all .15s}
.sz:hover{color:#fff;background:rgba(255,255,255,0.1)}
.sz.on{background:#6366f1;border-color:#6366f1;color:#fff}
#pglbl{font-size:11px;font-weight:600;color:rgba(255,255,255,0.3);padding:5px 10px;border-radius:8px;background:rgba(255,255,255,0.05)}

#stage{
  position:fixed;inset:50px 0 0;
  display:flex;align-items:center;justify-content:center;
}

/* Binder shell */
#shell{
  display:flex;
  border-radius:4px 12px 12px 4px;
  box-shadow:0 40px 100px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.04);
}

/* Spine */
#spine{
  width:28px;flex-shrink:0;
  border-radius:4px 0 0 4px;
  background:linear-gradient(to right,#0e0c1a,#1e1a3a,#2a2460,#1e1a3a,#0e0c1a);
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  box-shadow:inset -3px 0 8px rgba(0,0,0,0.5);
}
.ring{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(from 0deg,#1e1b4b,#6366f1,#c7d2fe,#6366f1,#1e1b4b);
  border:1.5px solid rgba(165,180,252,0.4);
  box-shadow:0 0 10px rgba(99,102,241,0.5);
}

/* turn.js flipbook */
#book{border-radius:0 12px 12px 0;overflow:hidden}
#book .page{overflow:hidden}

/* Page content */
.pg{
  width:100%;height:100%;
  position:relative;
}
.pg.lp{background:linear-gradient(to right,#1a1828,#1e1c2e)}
.pg.rp{background:linear-gradient(to left,#1a1828,#1e1c2e)}
.pg.lp::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(to left,rgba(0,0,0,0.35),transparent);pointer-events:none}
.pg.rp::after{content:'';position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(to right,rgba(0,0,0,0.35),transparent);pointer-events:none}

/* Cover */
.cover{
  width:100%;height:100%;
  background:var(--cover-color,linear-gradient(150deg,#1e1b4b,#312e81,#4c1d95));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  position:relative;overflow:hidden;
}
.cover::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 40%,rgba(139,92,246,0.25),transparent 65%)}
.cover-ball{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(180deg,#ef4444 0%,#ef4444 48%,#111827 48%,#111827 52%,#f9fafb 52%);
  border:7px solid #0f172a;
  box-shadow:0 0 0 2px rgba(255,255,255,0.1),0 20px 60px rgba(239,68,68,0.4);
  position:relative;animation:bob 3s ease-in-out infinite;
}
.cover-ball::after{content:'';position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;background:#f9fafb;border:6px solid #0f172a;transform:translate(-50%,-50%)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cover-title{font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.75);text-align:center;padding:0 20px}

/* Card grid */
.cgrid{
  position:absolute;inset:0;
  display:grid;padding:14px 12px;gap:8px;
  z-index:1;
}
.g3x3{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.g2x2{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.g4x3{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}

/* Sleeve */
.slv{
  border-radius:5px;position:relative;overflow:hidden;cursor:pointer;
  background:rgba(99,102,241,0.1);
  border:1.5px solid rgba(99,102,241,0.2);
  transition:transform .15s,box-shadow .15s,border-color .15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
}
.slv::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,0.35) 0%,transparent 35%);border-radius:inherit}
.slv:hover{transform:scale(1.04);border-color:#6366f1;box-shadow:0 6px 20px rgba(0,0,0,0.3),0 0 0 1.5px #6366f1}
.slv img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;position:relative;z-index:1}
.slv.mt{background:rgba(255,255,255,0.03);border:1.5px dashed rgba(99,102,241,0.3);box-shadow:none}
.slv.mt:hover{border-color:#6366f1;background:rgba(99,102,241,0.05)}
.slv.mt::after{content:'+';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300;color:rgba(99,102,241,0.25);z-index:1}
.slv.mt:hover::after{color:rgba(99,102,241,0.6)}
.pgn{position:absolute;bottom:6px;z-index:3;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.2)}
.lp .pgn{left:10px}
.rp .pgn{right:10px}

/* Arrows */
.arr{
  position:fixed;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;z-index:50;
  background:rgba(20,20,30,0.9);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.5);font-size:26px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;user-select:none;line-height:1;
}
.arr:hover{background:#6366f1;border-color:#6366f1;color:#fff;transform:translateY(-50%) scale(1.08)}
.arr:disabled{opacity:.12;pointer-events:none}
#aL{left:14px}
#aR{right:14px}

/* Picker */
#picker{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
#picker.open{display:flex}
#pbox{background:#18181f;border:1px solid rgba(255,255,255,0.1);border-radius:16px;width:min(700px,95vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.8)}
.ph{padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:10px}
.ph h3{font-size:14px;font-weight:700;letter-spacing:.06em;flex:1;text-transform:uppercase}
.px{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.px:hover{background:#ef4444;border-color:#ef4444;color:#fff}
.pc{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,0.07)}
.pc select,.pc input{flex:1;min-width:150px;padding:8px 12px;background:#1c1a2a;border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;outline:none;-webkit-appearance:none;appearance:none}
.pc select:focus,.pc input:focus{border-color:#6366f1}.pc select option{background:#1c1a2a;color:#fff}
.pc input::placeholder{color:rgba(255,255,255,0.2)}
#pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;padding:14px 20px 24px;overflow-y:auto;flex:1}
.pcd{border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;aspect-ratio:2.5/3.5;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;transition:all .15s}
.pcd:hover{border-color:#6366f1;transform:scale(1.06) translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.5)}
.pcd img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.pcd.clr{border:2px dashed rgba(255,255,255,0.1);flex-direction:column;gap:4px}
.pcd.clr:hover{border-color:#ef4444}
.pcd.clr .ci{font-size:20px;color:rgba(255,255,255,0.15)}
.pcd.clr .ct{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.2)}
.pcd.clr:hover .ci,.pcd.clr:hover .ct{color:#ef4444}
#pmsg{padding:2.5rem;text-align:center;color:rgba(255,255,255,0.25);font-size:13px}
/* Hover zoom */
.pcd:hover{border-color:#6366f1;transform:scale(1.08) translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.5);z-index:10;}

/* Card info panel */
#cardInfo{
  padding:12px 20px;border-top:1px solid rgba(255,255,255,0.07);
  min-height:72px;display:flex;align-items:center;gap:14px;
  background:#111118;
}
#cardInfo.empty{display:flex;align-items:center;justify-content:center}
#cardInfo.empty span{font-size:12px;color:rgba(255,255,255,0.2);font-style:italic}
#ciThumb{width:44px;height:62px;border-radius:4px;object-fit:cover;flex-shrink:0;display:none}
#ciText{flex:1;min-width:0}
#ciName{font-size:14px;font-weight:700;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ciSub{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:6px}
#ciPills{display:flex;gap:6px;flex-wrap:wrap}
.cipill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:0.04em}
.cipill.price{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.25)}
.cipill.rarity{background:rgba(99,102,241,0.15);color:#a78bfa;border:1px solid rgba(99,102,241,0.25)}
.cipill.artist{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.1)}
.cipill.type{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.2)}

</style>
</head>
<body>

<div id="bar">
  <a class="back" href="/">← Collection</a>
  <input id="bname" value="My Binder" oninput="save()">
  <div class="sp"></div>
  <button class="sz on" id="sz9"  onclick="setSize('9')">9-Pocket</button>
  <button class="sz"    id="sz4"  onclick="setSize('4')">4-Pocket</button>
  <button class="sz"    id="sz12" onclick="setSize('12')">12-Pocket</button>
  <span id="pglbl">Pages 1–2</span>
</div>

<button class="arr" id="aL" onclick="prev()">‹</button>
<button class="arr" id="aR" onclick="next()">›</button>

<div id="stage">
  <div id="shell">
    <div id="spine"></div>
    <div id="book"></div>
  </div>
</div>

<div id="picker">
  <div id="pbox">
    <div class="ph"><h3>Place a Card</h3><button class="px" onclick="closePicker()">✕</button></div>
    <div class="pc">
      <select id="pSet" onchange="loadSet()"><option value="">Loading sets…</option></select>
      <input id="pSrch" placeholder="Search name or number…" oninput="renderPicker()">
    </div>
    <div id="pgrid"><div id="pmsg">Choose a set above</div></div>
  </div>
    <div id="cardInfo" class="empty"><img id="ciThumb" src="" alt=""><div id="ciText"><div id="ciName"></div><div id="ciSub"></div><div id="ciPills"></div></div><span>Hover a card to see details</span></div>
  </div>
</div>

<script>
const CFG={'9':{c:3,r:3},'4':{c:2,r:2},'12':{c:4,r:3}};
const GCLS={'9':'g3x3','4':'g2x2','12':'g4x3'};
const RINGS={'9':8,'4':6,'12':8};
const TOTAL=40;

let sz='9',aSlot=null,pCards=[],allSets=[];
let binder={name:'My Binder',size:'9',slots:{}};
let user=null,binderId=null;
function mk(){return{name:'My Binder',size:'9',slots:{}}}
function spp(){return CFG[sz].c*CFG[sz].r}

function getParams(){
  const p=new URLSearchParams(location.search);
  const user=p.get('user')||sessionStorage.getItem('ptcg_user')||localStorage.getItem('ptcg_user');
  return {user, id:p.get('id')};
}

async function save(){
  binder.name=$('#bname').val();binder.size=sz;
  if(user&&binderId){
    try{
      await fetch('/api/binders/'+user+'/'+binderId,{
        method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:binder.name,size:binder.size,slots:binder.slots})
      });
    }catch(e){console.log('Save failed',e);}
  }
}

function setSize(s){
  sz=s;
  $('.sz').removeClass('on');$('#sz'+s).addClass('on');
  init();save();
}

function pageHTML(i){
  // i=0: front cover, i=1: back cover (right), i=2+: content
  if(i===0){
    return `<div class="cover"><div class="cover-ball"></div><div class="cover-title">${$('#bname').val()}</div></div>`;
  }
  if(i===TOTAL*2+1){
    return `<div class="cover" style="background:linear-gradient(150deg,#1e1b4b,#2a2760)"><div class="cover-title" style="font-size:12px;opacity:0.4">END</div></div>`;
  }
  const real=i-1; // 0-based page
  const side=real%2===0?'lp':'rp';
  const base=real*spp();
  let h=`<div class="pg ${side}"><div class="cgrid ${GCLS[sz]}">`;
  for(let s=0;s<spp();s++){
    const si=base+s,card=binder.slots[si]||binder.slots[String(si)]||null;
    h+=`<div class="slv ${card?'':'mt'}" data-slot="${si}" onclick="openPicker(${si})">`;
    if(card)h+=`<img src="${card.img}" alt="${card.name}" loading="lazy">`;
    h+=`</div>`;
  }
  h+=`</div><div class="pgn">Pg ${real+1}</div></div>`;
  return h;
}

function calcSize(){
  const W=window.innerWidth,H=window.innerHeight-50;
  // page aspect: slightly taller than wide, like a real binder page
  const aspect=0.72;
  let ph=Math.min(H*0.88,600);
  let pw=ph*aspect;
  if(pw*2+28>W-120){pw=(W-120-28)/2;ph=pw/aspect;}
  return{pw:Math.floor(pw),ph:Math.floor(ph)};
}

function init(){
  const {pw,ph}=calcSize();
  const bk=$('#book');
  try{bk.turn('destroy');}catch(e){}
  bk.empty();
  bk.css({width:pw*2,height:ph});
  // Spine
  $('#spine').css({height:ph});
  $('#spine').html(Array.from({length:RINGS[sz]},()=>'<div class="ring"></div>').join(''));
  // Pages
  const total=TOTAL*2+2;
  for(let i=0;i<total;i++){
    const div=$('<div class="page">').html(pageHTML(i));
    bk.append(div);
  }
  bk.turn({
    width:pw*2,height:ph,
    autoCenter:true,gradients:true,acceleration:true,duration:600,page:1,
    when:{
      turned:function(e,pg){
        const lp=pg%2===0?pg-1:pg;
        $('#pglbl').text(`Pages ${lp}–${lp+1}`);
        $('#aL').prop('disabled',pg<=2);
        $('#aR').prop('disabled',pg>=total-1);
      }
    }
  });
  $('#aL').prop('disabled',true);
  $('#aR').prop('disabled',false);
}

function next(){try{$('#book').turn('next');}catch(e){}}
function prev(){try{$('#book').turn('previous');}catch(e){}}

// Picker
function openPicker(si){
  aSlot=si;
  $('#picker').addClass('open');
  $('#pSrch').val('');
  renderPicker();
  setTimeout(()=>$('#pSrch').focus(),50);
}
function closePicker(){$('#picker').removeClass('open');aSlot=null;}

function showCardInfo(card){
  const ci=document.getElementById('cardInfo');
  ci.classList.remove('empty');
  const thumb=document.getElementById('ciThumb');
  if(card.img){thumb.src=card.img;thumb.style.display='block';}
  else thumb.style.display='none';
  document.getElementById('ciName').textContent=card.name+(card.hp?' · '+card.hp+' HP':'');
  document.getElementById('ciSub').textContent=(card.supertype||'Pokémon')+(card.types?' · '+card.types:'')+(card.num?' · #'+card.num:'');
  let pills='';
  if(card.price>0) pills+=`<span class="cipill price">$${card.price.toFixed(2)} NM</span>`;
  if(card.rarity) pills+=`<span class="cipill rarity">${card.rarity}</span>`;
  if(card.artist) pills+=`<span class="cipill artist">✏ ${card.artist}</span>`;
  document.getElementById('ciPills').innerHTML=pills;
}
function hideCardInfo(){
  const ci=document.getElementById('cardInfo');
  ci.classList.add('empty');
  ci.querySelector('span')?ci.querySelector('.empty span')?.remove():null;
  ci.innerHTML='<span style="font-size:12px;color:rgba(255,255,255,0.2);font-style:italic">Hover a card to see details</span>';
}

function renderPicker(){
  const q=$('#pSrch').val().toLowerCase().trim();
  const grid=$('#pgrid');
  if(!pCards.length){grid.html('<div id="pmsg">Choose a set above</div>');return;}
  const list=pCards.filter(c=>!q||c.name.toLowerCase().includes(q)||c.num.includes(q));
  let h='<div class="pcd clr" onclick="place(null)"><div class="ci">✕</div><div class="ct">Clear</div></div>';
  list.forEach(c=>{
    h+=`<div class="pcd" onclick='place(${JSON.stringify(c)})' onmouseenter='showCardInfo(${JSON.stringify(c)})' onmouseleave='hideCardInfo()'>`;
    if(c.img)h+=`<img src="${c.img}" alt="${c.name}" loading="lazy">`;
    h+=`</div>`;
  });
  grid.html(h);
}

function place(c){
  if(aSlot===null)return;
  if(c)binder.slots[aSlot]={img:c.img,name:c.name,num:c.num};
  else delete binder.slots[aSlot];
  // Update the slot in place without full rebuild
  const el=$(`[data-slot="${aSlot}"]`);
  if(el.length){
    if(c){el.removeClass('mt').html(`<img src="${c.img}" alt="${c.name}">`)}
    else{el.addClass('mt').html('');}
  }
  closePicker();
  save();
}

async function loadSet(){
  const id=$('#pSet').val();if(!id)return;
  $('#pgrid').html('<div id="pmsg">Loading…</div>');pCards=[];
  try{
    const d=await fetch('/api/cards/'+id).then(r=>r.json());
    pCards=d.map(c=>{
    const sp=c.skuPrices;
    let price=0;
    if(sp){const k=Object.keys(sp).find(k=>k.startsWith('NM/'));if(k)price=sp[k];}
    if(!price&&c.tcgplayer?.prices){
      const p=c.tcgplayer.prices;
      price=p.holofoil?.market||p.normal?.market||p.reverseHolofoil?.market||0;
    }
    return{id:c.id,name:c.name,num:c.number,img:c.images?.small||'',
      artist:c.artist||'',rarity:c.rarity||'',
      types:(c.types||[]).join(', '),
      hp:c.hp||'',supertype:c.supertype||'',
      price:price};
  });
    renderPicker();
  }catch(e){$('#pgrid').html('<div id="pmsg">Failed to load</div>');}
}

async function loadSets(){
  try{
    const d=await fetch('/api/sets').then(r=>r.json());
    $('#pSet').html('<option value="">— Choose a set —</option>'+d.map(s=>`<option value="${s.id}">${s.name} (${s.total})</option>`).join(''));
  }catch(e){}
}

$(document).keydown(e=>{
  if($('#picker').hasClass('open')){if(e.key==='Escape')closePicker();return;}
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft')prev();
});

$(window).on('resize',()=>init());

$(()=>{
  const params=getParams();
  user=params.user;binderId=params.id;
  // Update back button to go to shelf
  const backLink=$('.back');
  if(user){
    backLink.attr('href','/shelf?user='+encodeURIComponent(user));
    sessionStorage.setItem('ptcg_user',user);
  }
  if(user&&binderId){
    // Load binder from server
    fetch('/api/binders/'+user+'/'+binderId)
      .then(r=>r.json())
      .then(data=>{
        binder=data;
        sz=binder.size||'9';
        $('.sz').removeClass('on');$('#sz'+sz).addClass('on');
        $('#bname').val(binder.name||'My Binder');
        init();loadSets();
      })
      .catch(()=>{
        // Fallback
        sz=binder.size||'9';
        $('.sz').removeClass('on');$('#sz'+sz).addClass('on');
