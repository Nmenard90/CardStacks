<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Binders</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#13111e;font-family:'Inter',sans-serif;color:#fff}

#bar{
  position:sticky;top:0;z-index:100;height:54px;
  background:rgba(15,13,22,0.95);border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;gap:14px;padding:0 24px;
  backdrop-filter:blur(16px);
}
.back{font-size:12px;font-weight:600;color:rgba(255,255,255,0.4);text-decoration:none;
  padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);transition:all .15s}
.back:hover{color:#fff;background:rgba(255,255,255,0.08)}
.bar-title{font-size:16px;font-weight:700;letter-spacing:-0.01em}
.bar-user{font-size:12px;color:rgba(255,255,255,0.35);padding:4px 10px;
  border-radius:99px;background:rgba(255,255,255,0.06)}
.sp{flex:1}
.new-btn{
  font-size:13px;font-weight:700;padding:8px 18px;border-radius:10px;
  background:#6366f1;border:none;color:#fff;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(99,102,241,0.35);
}
.new-btn:hover{background:#4f46e5;transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,0.45)}

#main{padding:40px 24px 80px;max-width:1100px;margin:0 auto}

.shelf-label{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
  color:rgba(255,255,255,0.3);margin-bottom:24px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}

/* Binder card */
.bcard{
  border-radius:12px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(255,255,255,0.07);
  transition:transform .2s,box-shadow .2s;
  background:#1c1a2a;position:relative;
  display:flex;flex-direction:column;
}
.bcard:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,0.5),0 0 0 1px rgba(99,102,241,0.4)}

/* Cover area */
.bcover{
  height:220px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1e1b4b,#312e81,#4c1d95);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
.bcover-img{width:100%;height:100%;object-fit:cover;display:block}
.bcover-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.65) 100%);
}
/* spine strip on left */
.bcover::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:14px;z-index:2;
  background:linear-gradient(to right,#0d0b1e,#1e1a3e);
  box-shadow:2px 0 6px rgba(0,0,0,0.4);
}
/* rings */
.bcover-rings{
  position:absolute;left:0;top:0;bottom:0;width:14px;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
}
.bcover-ring{width:10px;height:10px;border-radius:50%;
  background:conic-gradient(from 0deg,#1e1b4b,#6366f1,#c7d2fe,#6366f1,#1e1b4b);
  box-shadow:0 0 6px rgba(99,102,241,0.6)}

.bcover-default-icon{font-size:48px;position:relative;z-index:1;
  animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Info area */
.binfo{padding:14px 14px 14px 20px;display:flex;align-items:center;gap:8px}
.binfo-text{flex:1;min-width:0}
.bname{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px}
.bmore{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0}
.bmore:hover{background:rgba(255,255,255,0.12);color:#fff}

/* Delete confirm */
.del-confirm{
  position:absolute;inset:0;background:rgba(20,18,30,0.96);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  border-radius:12px;z-index:10;padding:20px;text-align:center;
}
.del-confirm.show{display:flex}
.del-confirm p{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.5}
.del-confirm strong{color:#fff}
.del-confirm .del-btns{display:flex;gap:8px}
.del-confirm button{font-size:12px;font-weight:600;padding:7px 16px;border-radius:8px;
  cursor:pointer;border:none;transition:all .15s}
.del-yes{background:#ef4444;color:#fff}
.del-yes:hover{background:#dc2626}
.del-no{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6)}
.del-no:hover{background:rgba(255,255,255,0.12);color:#fff}

/* Empty state */
.empty{text-align:center;padding:80px 20px;color:rgba(255,255,255,0.25)}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty h3{font-size:18px;font-weight:600;color:rgba(255,255,255,0.5);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6;max-width:300px;margin:0 auto}

/* ── CREATE MODAL ── */
#modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.75);
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
#modal.open{display:flex}
#mbox{background:#1c1a2a;border:1px solid rgba(255,255,255,0.1);border-radius:18px;
  width:min(440px,95vw);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.7)}
.mhead{padding:20px 22px 16px;border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;gap:10px}
.mhead h3{font-size:15px;font-weight:700;flex:1}
.mx{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mx:hover{background:#ef4444;border-color:#ef4444;color:#fff}
.mbody{padding:20px 22px}
.mfield{margin-bottom:18px}
.mfield label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:8px}
.mfield input[type=text]{width:100%;padding:10px 14px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;outline:none}
.mfield input[type=text]:focus{border-color:#6366f1}
.mfield input[type=text]::placeholder{color:rgba(255,255,255,0.2)}

/* Cover upload area */
.cover-upload{
  border:2px dashed rgba(255,255,255,0.15);border-radius:12px;
  padding:0;overflow:hidden;cursor:pointer;transition:border-color .15s;
  height:140px;position:relative;display:flex;align-items:center;justify-content:center;
}
.cover-upload:hover{border-color:#6366f1}
.cover-upload-placeholder{text-align:center;pointer-events:none}
.cover-upload-placeholder .uicon{font-size:28px;margin-bottom:8px;color:rgba(255,255,255,0.2)}
.cover-upload-placeholder p{font-size:12px;color:rgba(255,255,255,0.3)}
.cover-upload-placeholder span{font-size:11px;color:rgba(255,255,255,0.18)}
.cover-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:10px}
#coverInput{display:none}

.sz-row{display:flex;gap:8px}
.sz-opt{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-size:12px;
  font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.sz-opt:hover{background:rgba(255,255,255,0.08);color:#fff}
.sz-opt.on{background:#6366f1;border-color:#6366f1;color:#fff}

.mfoot{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.mfoot button{font-size:13px;font-weight:600;padding:9px 20px;border-radius:10px;
  cursor:pointer;border:none;transition:all .15s}
.m-cancel{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5)}
.m-cancel:hover{background:rgba(255,255,255,0.1);color:#fff}
.m-create{background:#6366f1;color:#fff;box-shadow:0 4px 14px rgba(99,102,241,0.35)}
.m-create:hover{background:#4f46e5;transform:translateY(-1px)}
</style>
</head>
<body>

<div id="bar">
  <a class="back" href="/">← Collection</a>
  <span class="bar-title">My Binders</span>
  <span class="bar-user" id="userBadge"></span>
  <div class="sp"></div>
  <button class="new-btn" onclick="openModal()">+ New Binder</button>
</div>

<div id="main">
  <div class="shelf-label" id="shelfLabel">Loading…</div>
  <div class="grid" id="grid"></div>
</div>

<!-- Create modal -->
<div id="modal">
  <div id="mbox">
    <div class="mhead">
      <h3>New Binder</h3>
      <button class="mx" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="mfield">
        <label>Binder Name</label>
        <input type="text" id="mName" placeholder="e.g. Base Set Collection" maxlength="40">
      </div>
      <div class="mfield">
        <label>Cover Photo</label>
        <div class="cover-upload" onclick="document.getElementById('coverInput').click()">
          <div class="cover-upload-placeholder" id="uploadPlaceholder">
            <div class="uicon">📷</div>
            <p>Click to upload a photo</p>
            <span>JPG, PNG, GIF — max 5MB</span>
          </div>
          <img id="coverPreview" src="" alt="" style="display:none">
        </div>
        <input type="file" id="coverInput" accept="image/*" onchange="handleCover(event)">
      </div>
      <div class="mfield">
        <label>Pocket Size</label>
        <div class="sz-row">
          <div class="sz-opt on" data-sz="9" onclick="selectSz(this)">9-Pocket</div>
          <div class="sz-opt" data-sz="4" onclick="selectSz(this)">4-Pocket</div>
          <div class="sz-opt" data-sz="12" onclick="selectSz(this)">12-Pocket</div>
        </div>
      </div>
    </div>
    <div class="mfoot">
      <button class="m-cancel" onclick="closeModal()">Cancel</button>
      <button class="m-create" onclick="createBinder()">Create Binder →</button>
    </div>
  </div>
</div>

<script>
let user = null, binders = [], pendingCover = null, pendingSz = '9';

// Get user from URL param or session
function getUser(){
  const p = new URLSearchParams(location.search);
  return p.get('user') || localStorage.getItem('ptcg_user');
}

async function load(){
  user = getUser();
  if(!user){ location.href='/'; return; }
  document.getElementById('userBadge').textContent = user;
  document.title = `${user}'s Binders`;

  try{
    const d = await fetch(`/api/binders/${user}`).then(r=>r.json());
    binders = d;
    render();
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load binders</h3></div>';
  }
}

function render(){
  const lbl = document.getElementById('shelfLabel');
  const grid = document.getElementById('grid');
  lbl.textContent = `${binders.length} binder${binders.length!==1?'s':''}`;
  if(!binders.length){
    grid.innerHTML=`<div class="empty">
      <div class="empty-icon">📚</div>
      <h3>No binders yet</h3>
      <p>Click "+ New Binder" to create your first one</p>
    </div>`;
    return;
  }
  grid.innerHTML = binders.map(b=>`
    <div class="bcard" id="bc_${b.id}">
      <div class="bcover" onclick="openBinder('${b.id}')">
        ${b.cover
          ? `<img class="bcover-img" src="${b.cover}" alt="${b.name}">`
          : `<div class="bcover-default-icon">📖</div>`
        }
        <div class="bcover-overlay"></div>
        <div class="bcover-rings">
          <div class="bcover-ring"></div>
          <div class="bcover-ring"></div>
          <div class="bcover-ring"></div>
        </div>
      </div>
      <div class="binfo">
        <div class="binfo-text">
          <div class="bname">${b.name}</div>
          <div class="bmeta">${b.size||'9'}-pocket · ${Object.keys(b.slots||{}).length} cards</div>
        </div>
        <button class="bmore" onclick="event.stopPropagation();toggleDelete('${b.id}')" title="Delete">⋯</button>
      </div>
      <div class="del-confirm" id="del_${b.id}">
        <p>Delete <strong>${b.name}</strong>?<br>This cannot be undone.</p>
        <div class="del-btns">
          <button class="del-no" onclick="toggleDelete('${b.id}')">Cancel</button>
          <button class="del-yes" onclick="deleteBinder('${b.id}')">Delete</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openBinder(id){
  location.href = `/binder?user=${encodeURIComponent(user)}&id=${id}`;
}

function toggleDelete(id){
  const el = document.getElementById('del_'+id);
  el.classList.toggle('show');
}

async function deleteBinder(id){
  await fetch(`/api/binders/${user}/${id}`, {method:'DELETE'});
  binders = binders.filter(b=>b.id!==id);
  render();
}

// Modal
function openModal(){
  document.getElementById('mName').value='';
  document.getElementById('coverPreview').style.display='none';
  document.getElementById('uploadPlaceholder').style.display='block';
  pendingCover=null; pendingSz='9';
  document.querySelectorAll('.sz-opt').forEach(e=>e.classList.toggle('on',e.dataset.sz==='9'));
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('mName').focus(),50);
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

function selectSz(el){
  document.querySelectorAll('.sz-opt').forEach(e=>e.classList.remove('on'));
  el.classList.add('on'); pendingSz=el.dataset.sz;
}

function handleCover(e){
  const file = e.target.files[0]; if(!file) return;
  if(file.size>5*1024*1024){ alert('Image must be under 5MB'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    pendingCover = ev.target.result;
    const img = document.getElementById('coverPreview');
    img.src = pendingCover; img.style.display='block';
    document.getElementById('uploadPlaceholder').style.display='none';
  };
  reader.readAsDataURL(file);
}

async function createBinder(){
  const name = document.getElementById('mName').value.trim()||'My Binder';
  const btn = document.querySelector('.m-create');
  btn.textContent='Creating…'; btn.disabled=true;
  try{
    const b = await fetch(`/api/binders/${user}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, size:pendingSz, cover:pendingCover||''})
    }).then(r=>r.json());
    closeModal();
    // Go straight to the new binder
    location.href=`/binder?user=${encodeURIComponent(user)}&id=${b.id}`;
  }catch(e){
    alert('Failed to create binder');
    btn.textContent='Create Binder →'; btn.disabled=false;
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && document.getElementById('modal').classList.contains('open')) createBinder();
});

load();
</script>
</body>
</html>
